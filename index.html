<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiovisual Sequencer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Canvas for Visual Effects -->
    <canvas id="visualCanvas"></canvas>

    <!-- Show UI Button (visible only when UI is hidden) -->
    <div id="showUIButton" class="show-ui-button hidden"></div>

    <!-- Main Container -->
    <div id="app">
        <!-- Sequencer Section -->
        <div id="sequencer">
            <!-- Instrument Rows -->
            <div class="instrument-row" data-instrument="kick">
                <div class="instrument-label">KICK</div>
                <div class="row-content">
                    <div class="steps-container">
                        <div class="steps" id="kick-steps"></div>
                        <input type="range" class="volume-knob" data-instrument="kick" min="0" max="100" value="70" orient="vertical">
                    </div>
                    <div class="params" id="kick-params"></div>
                </div>
            </div>

            <div class="instrument-row" data-instrument="snare">
                <div class="instrument-label">SNARE</div>
                <div class="row-content">
                    <div class="steps-container">
                        <div class="steps" id="snare-steps"></div>
                        <input type="range" class="volume-knob" data-instrument="snare" min="0" max="100" value="70" orient="vertical">
                    </div>
                    <div class="params" id="snare-params"></div>
                </div>
            </div>

            <div class="instrument-row" data-instrument="hihat">
                <div class="instrument-label">HIHAT</div>
                <div class="row-content">
                    <div class="steps-container">
                        <div class="steps" id="hihat-steps"></div>
                        <input type="range" class="volume-knob" data-instrument="hihat" min="0" max="100" value="70" orient="vertical">
                    </div>
                    <div class="params" id="hihat-params"></div>
                </div>
            </div>

            <div class="instrument-row" data-instrument="tom">
                <div class="instrument-label">TOM</div>
                <div class="row-content">
                    <div class="steps-container">
                        <div class="steps" id="tom-steps"></div>
                        <input type="range" class="volume-knob" data-instrument="tom" min="0" max="100" value="70" orient="vertical">
                    </div>
                    <div class="params" id="tom-params"></div>
                </div>
            </div>
        </div>

        <!-- Controls Section -->
        <div id="controls">
            <div class="control-group">
                <label>Kick Distortion</label>
                <input type="range" id="fader1" min="0" max="100" value="0" class="fader">
                <span class="value-display">0</span>
            </div>

            <div class="control-group">
                <label>Snare Feedback</label>
                <input type="range" id="fader2" min="0" max="100" value="0" class="fader">
                <span class="value-display">0</span>
            </div>

            <div class="control-group">
                <label>Hihat Sustain</label>
                <input type="range" id="fader3" min="0" max="100" value="0" class="fader">
                <span class="value-display">0</span>
            </div>

            <div class="control-group">
                <label>Tom Pitch</label>
                <input type="range" id="fader4" min="0" max="100" value="50" class="fader">
                <span class="value-display">50</span>
            </div>

            <div class="control-group">
                <label>Global Blur</label>
                <input type="range" id="fader5" min="0" max="100" value="0" class="fader">
                <span class="value-display">0</span>
            </div>

            <div class="control-group">
                <label>BPM</label>
                <input type="range" id="bpmFader" min="60" max="180" value="123" class="fader">
                <input type="number" id="bpmInput" min="60" max="180" value="123" class="bpm-input">
            </div>

            <div class="control-group">
                <button id="playButton" class="play-button">PLAY</button>
                <div class="control-buttons">
                    <button id="resetButton" class="control-button">R</button>
                    <button id="flowerButton" class="control-button">F</button>
                    <button id="hideButton" class="control-button">B</button>
                </div>
            </div>
        </div>
    </div>

    <script src="audio-engine.js"></script>
    <script src="visual-engine.js"></script>
    <script src="sequencer.js"></script>
    <script src="app.js"></script>
</body>
</html>
